name: Build and Package Windows Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # 执行 package.json 中配置好的完整打包命令
      - name: Build and Package (MSI, Portable, ZIP)
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 收集 release 目录下生成的所有安装包与便携包
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Prism-Browser-Windows-x64
          path: |
            release/*.msi
            release/*.zip
            release/*.exe

      # 当推送 Git Tag (如 v0.2.0-beta.1) 时，自动创建 GitHub Release 并上传安装包
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            release/*.msi
            release/*.zip
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
